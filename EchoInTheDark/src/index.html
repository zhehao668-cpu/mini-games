<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>暗夜回声 · Echo in the Dark</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<canvas id="game"></canvas>

<div id="hud">
  <div class="group">
    <span class="hud-level" id="hudLevel">关卡 1 / 3</span>
    <div class="pebbles" id="pebbles"></div>
    <div class="noise-wrap">
      <span class="noise-txt">噪音</span>
      <div class="noise-bar"><div class="noise-fill" id="noiseFill"></div></div>
    </div>
  </div>
  <div class="group">
    <button id="restartBtn">重开 (R)</button>
  </div>
</div>

<div id="editorHint"></div>
<div id="editorBar">
  <button class="ebtn" data-mode="wall">墙</button>
  <button class="ebtn" data-mode="guard">守卫巡逻点</button>
  <button class="ebtn" data-mode="exit">出口</button>
  <button class="ebtn" data-mode="start">出生点</button>
  <button class="ebtn" id="newGuardBtn">新守卫路径</button>
  <button class="ebtn" id="exportBtn">导出 JSON</button>
  <button class="ebtn" id="closeEditorBtn">关闭 (Tab)</button>
</div>

<div id="exportModal">
  <div id="exportBox">
    <h3>关卡 JSON（可复制保存，或粘贴后导入）</h3>
    <textarea id="exportArea" spellcheck="false"></textarea>
    <div class="row">
      <button class="btn secondary" id="copyBtn" style="margin:0">复制</button>
      <button class="btn secondary" id="importBtn" style="margin:0">导入并应用</button>
      <button class="btn secondary" id="closeExportBtn" style="margin:0">关闭</button>
    </div>
  </div>
</div>

<div class="red-flash" id="redFlash"></div>

<div class="overlay" id="startOverlay">
  <div class="title">暗夜回声</div>
  <div class="subtitle">ECHO IN THE DARK</div>
  <p>你身处完全黑暗的地下迷宫。用声呐照亮墙体，在“看见”与“被听见”之间求生。</p>
  <div class="help">
    <div class="help-title">操 作 说 明</div>
    <div class="ctrl-row"><span class="keys"><kbd>W A S D</kbd><kbd>方向键</kbd></span><span class="desc">移动（黑暗中摸索）</span></div>
    <div class="ctrl-row"><span class="keys"><kbd>空格</kbd><kbd>鼠标左键</kbd></span><span class="desc">按住蓄力声呐 · 松开释放</span></div>
    <div class="ctrl-row"><span class="keys"><kbd>鼠标右键</kbd><kbd>E</kbd></span><span class="desc">投掷诱饵石子（每关 3 颗）</span></div>
    <div class="ctrl-row"><span class="keys"><kbd>R</kbd></span><span class="desc">重开本关</span></div>
    <div class="ctrl-row"><span class="keys"><kbd>Tab</kbd></span><span class="desc">关卡编辑器</span></div>
  </div>
  <div class="goal">目标：声呐照亮墙体 · 躲避守卫 · 抵达绿色出口</div>
  <button class="btn" id="startBtn">点击开始</button>
</div>

<div class="overlay hidden" id="winOverlay">
  <h2 id="winTitle">抵达出口</h2>
  <div class="rank" id="winRank"></div>
  <div class="stats">
    <div><span id="statTime">0.0s</span>用时</div>
    <div><span id="statSonar">0</span>声呐次数</div>
    <div><span id="statPebble">0</span>剩余石子</div>
  </div>
  <div class="row" style="display:flex;gap:14px;margin-top:6px;flex-wrap:wrap;justify-content:center">
    <button class="btn" id="nextBtn">下一关</button>
    <button class="btn secondary" id="winRestartBtn">重开本关</button>
  </div>
</div>

<div class="overlay hidden" id="loseOverlay">
  <h2 style="color:#ff5566">你被发现了</h2>
  <p>守卫在黑暗中听见了你的回响。</p>
  <button class="btn secondary" id="loseRestartBtn">重开本关 (R)</button>
</div>

<script src="audio.js"></script>
<script src="game.js"></script>
</body>
</html>
